backend:
  name: github
  repo: TU_USUARIO_DE_GITHUB/NOMBRE_DE_TU_REPOSITORIO # Cambia esto por tus datos
  branch: main # O master, según tu rama

media_folder: "images" # Carpeta donde se guardarán las fotos que subas
public_folder: "images"

collections:
  - name: "paginas"
    label: "Páginas"
    files:
      - file: "index.html"
        label: "Página de Inicio"
        name: "index"
        fields:
          - { label: "Título de la Web", name: "title", widget: "string" }
          - { label: "Texto Principal", name: "body", widget: "markdown" }
